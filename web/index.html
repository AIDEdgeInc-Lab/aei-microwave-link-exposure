<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infrastructure Weather Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <header class="hero">
    <h1>Infrastructure Weather Map</h1>
    <p class="subtitle">Find the nearest available weather observation for your infrastructure sites.</p>
    <div class="actions">
      <button id="btn-upload" class="btn btn-primary">Upload My Sites</button>
      <button id="btn-example" class="btn btn-secondary">Explore Example Sites</button>
    </div>
    <input type="file" id="file-input" accept=".csv" hidden />

    <p class="upload-help">
      Upload a CSV containing your infrastructure sites. Required columns:
      <code>site_id, site_name, latitude, longitude</code>.
      <a id="sample-link" href="sample_sites.csv" download>Download sample CSV</a>
    </p>

    <div id="status" class="status" hidden></div>
  </header>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
