[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aei-microwave-link-exposure"
version = "0.3.0"
description = "Given weather observations and a terrestrial microwave point-to-point link, calculate the link's weather-related exposure using transparent ITU-R engineering methods."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AID Edge Inc." }]
keywords = ["microwave", "point-to-point", "telecom", "weather", "itu-r", "rain-attenuation", "backhaul"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# Security floors (2026-11): requests>=2.33 and urllib3>=2.8 close CVE-2026-25645 (requests) and five urllib3 advisories
# (CVE-2026-44431, -44432, -97687, -97688, -97689). urllib3 is listed directly because requests alone (urllib3<3) would let an
# environment keep a vulnerable urllib3. Both need Python >=3.10, which is why requires-python is >=3.10.
open-meteo = ["requests>=2.33", "urllib3>=2.8"]
infrastructure = ["requests>=2.33", "urllib3>=2.8"]
explorer = ["streamlit>=1.30", "streamlit-folium>=0.20", "folium>=0.15", "requests>=2.33", "urllib3>=2.8"]
# "edge" adds nothing: the core package already has zero runtime dependencies and makes no network calls. The extra exists so
# `pip install aei-microwave-link-exposure[edge]` documents the intent and stays valid if an edge-only dependency is ever needed.
edge = []
dev = ["pytest>=7.0", "requests>=2.33", "urllib3>=2.8"]

[project.scripts]
aei-mw-edge = "aei_mw_exposure.edge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aei_mw_exposure = ["py.typed"]

[project.urls]
Homepage = "https://aidedgeinc.com/tools/"
Source = "https://github.com/AIDEdgeInc-Lab/aei-microwave-link-exposure"
Issues = "https://github.com/AIDEdgeInc-Lab/aei-microwave-link-exposure/issues"
