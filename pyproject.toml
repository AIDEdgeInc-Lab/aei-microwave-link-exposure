[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aei-microwave-link-exposure"
version = "0.1.1"
description = "Given weather observations and a terrestrial microwave point-to-point link, calculate the link's weather-related exposure using transparent ITU-R engineering methods."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AID Edge Inc." }]
keywords = ["microwave", "point-to-point", "telecom", "weather", "itu-r", "rain-attenuation", "backhaul"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
open-meteo = ["requests>=2.31"]
infrastructure = ["requests>=2.31"]
explorer = ["streamlit>=1.30", "streamlit-folium>=0.20", "folium>=0.15", "requests>=2.31"]
dev = ["pytest>=7.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aei_mw_exposure = ["py.typed"]
